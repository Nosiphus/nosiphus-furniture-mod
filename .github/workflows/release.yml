name: Publish Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Release changelog / description'
        required: false
        default: 'Bug fixes and performance improvements.'
      release_type:
        description: 'Release channel'
        required: true
        default: 'STABLE'
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA

  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Execute Mod Publishing Tasks
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_CHANGELOG: ${{ inputs.changelog || 'Production Release' }}
        run: ./gradlew publishMods