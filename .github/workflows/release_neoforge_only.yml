name: Publish NeoForge Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'NeoForge release changelog'
        required: false
        default: 'NeoForge updates and bug fixes.'
      release_type:
        description: 'Release channel'
        required: true
        default: 'STABLE'
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA

jobs:
  publish-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publish NeoForge Mod
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        # Runs the publishMods task specifically on the :neoforge subproject
        run: ./gradlew :neoforge:publishMods