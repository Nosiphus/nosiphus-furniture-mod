modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="https://github.com/Nosiphus/nosiphus-furniture-mod/issues" #optional

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
displayURL="https://www.curseforge.com/minecraft/mc-mods/nosiphus-furniture-mod" #optional (displayed in the mod UI)
logoFile="nfm-logo.png" #optional
credits="${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

[[mods]] #mandatory
modId = "cfm" #mandatory
version = "${version}" #mandatory
displayName = "MrCrayFish's Furniture Mod" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
displayURL="https://www.curseforge.com/minecraft/mc-mods/nosiphus-furniture-mod" #optional (displayed in the mod UI)
logoFile="cfm-logo.png" #optional
credits="The people who helped me when I first started creating mods. I wouldn't be here without them!" #optional
authors = "MrCrayFish, Nosiphus" #optional
description = '''MrCrayfish's Furniture Mod is all about adding functioning furniture and decorations. This mod currently adds over eighty unique blocks and is continuely growing with new updates. Ported by Nosiphus as part of Nosiphus Furniture Mod.''' #mandatory (Supports multiline text)

[[dependencies.${mod_id}]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${forge_version},)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.cfm]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${forge_version},)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.cfm]]
modId = "minecraft"
mandatory = true #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"