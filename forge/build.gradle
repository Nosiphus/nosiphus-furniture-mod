plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '[0.7-SNAPSHOT,)'
	id 'me.modmuss50.mod-publish-plugin' version '0.5.1'
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_minecraft}-${parchment_version}-${minecraft_version}"

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Native Mixin runtime argument
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('runs')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    implementation fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    implementation fg.deobf("mcp.mobius.waila:wthit:forge-${wthit_version}")
    implementation fg.deobf("lol.bai:badpackets:forge-${badpackets_version}")
    implementation fg.deobf("curse.maven:yogmod-372408:8812354")

    implementation fg.deobf("net.mehvahdjukaar:everycomp-forge:${everycomp_version}:forge") { transitive = false }
    implementation fg.deobf("net.mehvahdjukaar:moonlight-forge:${moonlight_version}:forge") { transitive = false }

    runtimeOnly fg.deobf("curse.maven:catalogue-459701:4766090")
}

mixin {
    add sourceSets.main, "cfm.refmap.json"
    config "cfm.mixins.json"
    config "cfm.forge.mixins.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.forge.mixins.json"
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'

    manifest.attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_author,
            'Specification-Version'   : project.version,
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_author,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : "cfm.mixins.json,cfm.forge.mixins.json,${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

publishMods {
    file = tasks.jar.archiveFile

    changelog = providers.environmentVariable("RELEASE_CHANGELOG").orElse("No changelog provided.")
    type = STABLE

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "593876"
        minecraftVersions.add("1.20.1")
        clientRequired = true
        serverRequired = true
        modLoaders.add("forge")

        displayName = "Forge - ${project.version} - ${project.minecraft_version}"

        optional {
            slug = "yogmod"
        }
		optional {
            slug = "jei"
        }
		optional {
            slug = "wthit-forge"
        }
		optional {
            slug = "every-compat"
        }
        incompatible {
            slug = "mrcrayfish-furniture-mod"
        }
    }
}

tasks.named('jar') {
    archiveFileName = "cfm+${project.mod_id}-forge-${project.version}-${project.minecraft_version}.jar"
}

tasks.named('sourcesJar') {
    archiveFileName = "cfm+${project.mod_id}-forge-${project.version}-${project.minecraft_version}-sources.jar"
}

tasks.named('javadocJar') {
    archiveFileName = "cfm+${project.mod_id}-forge-${project.version}-${project.minecraft_version}-javadoc.jar"
}